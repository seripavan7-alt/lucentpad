[project]
name = "lucentpad-sdk"
version = "0.0.0"
license = "Apache-2.0"
description = "Trace every LLM call your Python agent makes, with LucentPad"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lucentpad"]
