# Local dev stack: `make dev`, then open http://localhost:5173
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism  # local-only dev credential
      POSTGRES_DB: prism
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://prism:prism@db:5432/prism
      PRISM_SEED_SAMPLE: "1"
      PORT: "8000"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      db: { condition: service_healthy }

  dashboard:
    build:
      context: dashboard
    environment:
      PRISM_API_URL: http://api:8000
    ports: ["5173:5173"]
    volumes:
      - ./dashboard/src:/app/src
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
