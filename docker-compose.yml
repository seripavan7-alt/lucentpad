# Local dev stack: `make dev`, then open http://localhost:5173
name: lucentpad  # fixed project name, so containers/volumes do not depend on the folder name
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lucentpad
      POSTGRES_PASSWORD: lucentpad  # local-only dev credential
      POSTGRES_DB: lucentpad
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucentpad -d lucentpad"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://lucentpad:lucentpad@db:5432/lucentpad
      LUCENTPAD_SEED_SAMPLE: "1"
      PORT: "8000"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      db: { condition: service_healthy }

  dashboard:
    build:
      context: dashboard
    environment:
      LUCENTPAD_API_URL: http://api:8000
    ports: ["5173:5173"]
    volumes:
      - ./dashboard/src:/app/src
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
