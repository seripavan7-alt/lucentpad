[project]
name = "prism-server"
version = "0.0.0"
description = "Prism ingest and query API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "asyncpg>=0.29",
]

[project.scripts]
prism-server = "prism_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prism_server"]
