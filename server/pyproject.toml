[project]
name = "lucentpad-server"
version = "0.0.0"
license = "Apache-2.0"
description = "LucentPad ingest and query API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "asyncpg>=0.29",
]

[project.scripts]
lucentpad-server = "lucentpad_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lucentpad_server"]
